<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Login</title>
	<link href="/global/fontawesome/css/fontawesome.css" rel="stylesheet">
	<link href="/global/fontawesome/css/solid.css" rel="stylesheet">
	<style>
		html {
			height: 100%;
		}

		body.login {
			background: black;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.login-page {
			width: 500px;
			max-width: 100%;
			padding: 0;
		}

		.login-page .form .login .login-header {
			margin: 0;
			color: #061539;
		}

		.login-page .form .login .login-header h3 {
			margin: 0;
		}

		.form {
			position: relative;
			z-index: 1;
			background: #FFFFFF;
			margin: 0 auto;
			padding: 30px;
			text-align: center;
			box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
			border-radius: 15px;
		}

		.form input {
			outline: 0;
			background: #f2f2f2;
			width: 100%;
			border: 0;
			margin: 0 0 15px;
			padding: 15px;
			box-sizing: border-box;
			font-size: 1.2rem;
		}

		.form button {
			outline: 0;
			background-color: #328f8a;
			background-image: linear-gradient(45deg, #061539, #161d72);
			width: 100%;
			border: 0;
			padding: 15px;
			color: #FFFFFF;
			font-size: 1rem;
			transition: all 0.3 ease;
			cursor: pointer;
		}

		.form .message {
			margin: 15px 0 0;
			color: #b3b3b3;
			font-size: 1rem;
		}

		.form .message a {
			color: #4CAF50;
			text-decoration: none;
		}
	</style>
</head>
<body class="login">
	<div class="login-page">
		<div class="form">
			<div class="login">
				<div class="login-header">
					<h3>Login</h3>
					<p>Please enter your credentials to login.</p>
				</div>
			</div>
			<form id="login-form" class="login-form" action="/auth" method="post">
				<input id="username" name="username" type="text" placeholder="username" />
				<input name="password" type="password" placeholder="password" />
				<input name="redirect" type="hidden" value="{{redirect}}" />
				<button>login</button>
				<p class="message">{{message}}</p>
			</form>
		</div>
	</div>
	<script>
		document.getElementById('username').focus();
	</script>
</body>
</html>
