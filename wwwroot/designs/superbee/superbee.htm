<!DOCTYPE html>
<html lang="en-us">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<meta name="description" content="{{description}}" />
	<meta property="og:title" content="{{sitetitle}}" />
	<meta property="og:description" content="{{description}}" />
	<link href="/global/fontawesome/css/fontawesome.css" rel="stylesheet">
	<link href="/global/fontawesome/css/solid.css" rel="stylesheet">
	<link rel="stylesheet" href="/designs/superbee/superbee.css" />
	<script src="/global/scripts/htmx.min.js"></script>
	<script src="/global/scripts/global.js" defer></script>
	<link rel="icon" href="/designs/superbee/images/favicon.png" type="image/png">
	<link rel="apple-touch-icon" href="/designs/superbee/images/apple-touch-icon.png">
	<title>{{sitetitle}} {{pagetitle}}</title>
</head>
<body>
	{{bodytop}}
	<header>
		<div id="topbar">
			<div id="sitetitle"><a href="/"><img id="titleimage" src="/designs/superbee/images/Bee_transparent_web.png" alt="bee" />{{headersitetitle}}</a></div>
			<div id="mobilenav">
				<button id="searchicon" aria-controls="generate-slideout-menu" aria-expanded="false"><i class="fa-solid fa-magnifying-glass"></i></button>
				<button id="navicon" aria-controls="generate-slideout-menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
			</div>
		</div>
		<div id="sitesubtitle">{{subtitle}}</div>
		<div id="searchbox">
			<input id="search" name="search" type="text" placeholder="search phrase" /><i class="fa-solid fa-magnifying-glass"></i>
		</div>
		<div id="nav">
			<nav>{{navigation}}</nav>
		</div>
	</header>
	{{hero}}
	<main class="content">
		<div class="widthcontainer">
			<div id="pagecontent">
				<section>
					<h1>{{pagetitle}}</h1>
					<div class="body">{{content}}</div>
				</section>
			</div>
		</div>
	</main>
	<footer>
		<div class="widthcontainer">
			<div>{{footer1}}</div>
			<div>{{footer2}}</div>
			<div>{{footer3}}</div>
			<div>{{footer4}}</div>
		</div>
	</footer>
	{{bodybottom}}
</body>
</html>
