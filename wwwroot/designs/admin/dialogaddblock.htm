<form id="addblockform" hx-post="/admin/addblockform" hx-target="#pagecontent">
	<h2>Add Content Block to Page</h2>

	<label for="reference">Reference a block that exists elsewhere.</label><br />
	<select id="reference" name="reference" placeholder="todo">
		<option value="none">Select only if not building a new one.</option>
		<option value="todo">todo - build this out</option>
	</select>

	<div class="blocktypes">
		<label>select block type to add</label>
		<button class="blocktype" type="button" blockname="items" note="list of items">Items</button>
		<button class="blocktype" type="button" blockname="events" note="list or calendar of events">Events</button>
		<button class="blocktype" type="button" blockname="news" note="list of news articles">News</button>
		<button class="blocktype" type="button" blockname="entries" note="list or calendar of blog entries">Blog Entries</button>
		<button class="blocktype" type="button" blockname="form" note="custom form">Form</button>
	</div>
	<div class="blocknotes"></div>

	<input name="pageid" type="hidden" value="" />
	<input id="blocktype" name="blocktype" type="hidden" value="" />
	<label>Title</label><input name="title" type="text" value="" />

	<div class="buttonright"><button type="submit" id="adminaddblocksave"><i class="fa-regular fa-floppy-disk"></i></button></div>
</form>

<script>
	$('.blocktype').click(function () {
		$('.blocknotes').html($(this).attr('note'));
		$('#blocktype').val($(this).attr('blockname'));
	});
	$('#reference').change(function () {
		if ($(this).val() != 'none') {
			$('.blocktypes').hide();
			$('.blocknotes').hide();
			$('#blocktype').val('');
		}
		else {
			$('.blocktypes').show();
			$('.blocknotes').show();
		}
	});
</script>
