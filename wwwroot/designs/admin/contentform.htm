<section>
	<div class="buttonright">
		<button id="adminpageconfig" title="page settings" aria-label="page settings" hx-get="/admin/getpageconfig/{{pageid}}" hx-target="#cmsdialogform" onclick="document.getElementById('cmsdialog').showModal();"><i class="fa-solid fa-gear"></i></button>
		<button id="adminaddpagecontrol" title="add child page" aria-label="add child page" hx-post="/admin/getaddpageform/{{pageid}}" hx-target="#pagecontent"><i class="fa-solid fa-plus"></i></button>
		<button id="admindeletepagecontrol" title="delete page" aria-label="delete page" hx-post="/admin/deletepage/{{pageid}}" hx-confirm="Are you absolutely sure you wish to delete this page?" hx-target="#pagecontent"><i class="fa-solid fa-trash"></i></button>
		<button id="adminaddblockcontrol" title="add block of content to this page" aria-label="add block of content to this page" hx-get="/admin/getaddblockform/{{pageid}}" hx-target="#cmsdialogform" onclick="document.getElementById('cmsdialog').showModal();"><i class="fa-regular fa-square-plus"></i></button>
	</div>
	<form name="pagecontentform" id="pagecontentform" hx-post="/admin/pagecontentform">
		<input type="hidden" id="pageid" name="pageid" value="{{pageid}}" />
		<h1 id="ce_pagetitle" contenteditable="true" onblur="javascript: $('#pagetitle').val($('#ce_pagetitle').text());">{{pagetitle}}</h1>
		<input id="pagetitle" name="pagetitle" type="hidden" value="{{pagetitle}}" />
		<div id="content" class="body">{{content}}</div>
		<div id="blocks" class="body">{{blocks}}</div>
		<div class="buttonright hide"><button type="submit" id="savecontent"><i class="fa-regular fa-floppy-disk"></i></button></div>
		<script>$(document).ready(function () { SetupEvents(); });</script>
	</form>
</section>
