<form id="adminpageform" hx-post="/admin/pageconfigform" hx-target="#pagecontent">
	<input type="hidden" id="pageid" name="pageid" value="{{pageid}}" />
	<div><label for="dpageid">Page Id</label><input disabled="true" type="number" id="dpageid" name="dpageid" value="{{pageid}}" /></div>
	<div><label for="parentid">Parent Id</label><input type="number" id="parentid" name="parentid" value="{{parentid}}" /></div>
	<div><label for="navtitle">Nav Title</label><input type="text" id="navtitle" name="navtitle" value="{{navtitle}}" /></div>
	<div><label for="pagetitle">Page Title</label><input type="text" id="pagetitle" name="pagetitle" value="{{pagetitle}}" /></div>
	<div><label for="pageshortcut">Shortcut</label><input type="text" id="pageshortcut" name="pageshortcut" value="{{pageshortcut}}" /></div>
	<div><label for="pagesort">Sort</label><input type="number" id="pagesort" name="pagesort" value="{{pagesort}}" min="1" max="100" /></div>
	<div><label for="pageison">Status</label><input type="checkbox" id="pageison" name="pageison" {{pageison}}/></div>
	<div><label for="pageisprivate">Private</label><input type="checkbox" id="pageisprivate" name="pageisprivate" {{pageisprivate}} /></div>
	<div><label for="pageishidden">Hidden</label><input type="checkbox" id="pageishidden" name="pageishidden" {{pageishidden}} /></div>
	<div><label for="pagetags">Tags</label><input type="text" id="pagetags" name="pagetags" value="{{pagetags}}" /></div>
	<div><label for="pagehero">Hero Image Url</label><input type="text" id="pagehero" name="pagehero" value="{{pagehero}}" /></div>

	<div class="buttonright"><button type="submit" id="adminpagesave"><i class="fa-regular fa-floppy-disk"></i></button></div>
</form>
