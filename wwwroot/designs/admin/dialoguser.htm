<form id="adminuserform">
	<input type="hidden" id="userid" name="userid" value="{{userid}}" />
	<input type="hidden" id="siteid" name="siteid" value="{{siteid}}" />
	<div class="field"><label for="email">Email</label><input type="email" id="email" name="email" value="{{email}}" min="1" max="250" /></div>
	<div class="field"><label for="password">Password</label><input type="password" id="password" name="password" value="" /></div>
	<div class="field"><label for="vpassword">Verify Password</label><input type="password" id="vpassword" name="vpassword" value="" /></div>
	<div class="note">To change the user's password, enter a new password in both fields above.</div>
	<div class="field"><label for="firstname">First Name</label><input type="text" id="firstname" name="firstname" value="{{firstname}}" min="1" max="100" /></div>
	<div class="field"><label for="lastname">Last Name</label><input type="text" id="lastname" name="lastname" value="{{lastname}}" min="1" max="100" /></div>
	<div class="field"><label for="mobile">Mobile</label><input type="tel" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}" id="mobile" name="mobile" value="{{mobile}}" /></div>
	<div class="field"><label for="roles">Roles</label><div id="roles">{{roles}}</div></div>
	<div class="note">Roles are managed on the main user list page. To change roles, save any changes on this form and then return to the user list.</div>
	<div class="buttonright"><span><button class="big" type="submit" id="adminusersave" hx-post="/admin/saveuserform" class="overlaysave"><i class="fa-regular fa-floppy-disk"></i></button></span></div>
</form>

<div id="totp-section" style="margin-top:1em;">
	<p><strong>2FA Status:</strong> {{totp_status}} &nbsp; {{totp_button}}</p>
</div>
