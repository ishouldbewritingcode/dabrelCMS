<div class="adminuserslist">
	{{userlist}}
	<div class="buttonright"><span><button type="submit" id="adminadduser"><i class="fa-solid fa-plus"></i></button></span></div>
</div>
<form id="adminuserform">
	<input type="hidden" id="userid" name="userid" value="{{userid}}" />
	<input type="hidden" id="siteid" name="siteid" value="{{siteid}}" />
	<!--<div><label for="duserid">User Id</label><input disabled="true" type="number" id="duserid" name="duserid" value="{{userid}}" /></div>-->
	<!--<div><label for="siteid">Site Id</label><input type="number" id="siteid" name="siteid" value="{{siteid}}" /></div>-->
	<!--<div><label for="provider">Provider</label><input type="text" id="navtitle" name="navtitle" value="{{navtitle}}" /></div>-->
	<div><label for="email">Email</label><input type="email" id="email" name="email" value="{{email}}" min="1" max="250" /></div>
	<div><label for="password">Password</label><input type="password" id="password" name="password" value="" /></div>
	<div><label for="vpassword">Verify Password</label><input type="password" id="vpassword" name="vpassword" value="" /></div>
	<div class="note">To change the user's password, enter a new password in both fields above.</div>
	<div><label for="firstname">First Name</label><input type="text" id="firstname" name="firstname" value="{{firstname}}" min="1" max="100" /></div>
	<div><label for="lastname">Last Name</label><input type="text" id="lastname" name="lastname" value="{{lastname}}" min="1" max="100" /></div>
	<div><label for="mobile">Mobile</label><input type="tel" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}" id="mobile" name="mobile" value="{{mobile}}" /></div>
	<div><label for="roles">Roles</label><input type="text" id="roles" name="roles" value="{{roles}}" min="1" max="100" /></div>

	<div class="buttonright"><span><button class="big" type="submit" id="usersave"><i class="fa-regular fa-floppy-disk"></i></button></span></div>
</form>
