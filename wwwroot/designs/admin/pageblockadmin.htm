<fieldset>
	<legend>{{title}}</legend>
	{{title2}}
	<div class="buttonright">
		<button id="adminadditemcontrol" title="add entry" aria-label="add entry" hx-get="/admin/getitempageform/{{blockid}}" hx-target="#cmsdialogform" onclick="document.getElementById('cmsdialog').showModal();"><i class="fa-solid fa-plus"></i></button>
		<button id="adminblockconfig" title="block settings" aria-label="block settings" hx-get="/admin/getblockconfig/{{blockid}}" hx-target="#cmsdialogform" onclick="document.getElementById('cmsdialog').showModal();"><i class="fa-solid fa-gear"></i></button>
		<button id="admindeleteblockcontrol" title="delete block" aria-label="delete block" hx-post="/admin/deleteblock/{{blockid}}" hx-confirm="Are you absolutely sure you wish to delete this block?" hx-target="#pagecontent"><i class="fa-solid fa-trash"></i></button>
	</div>

	{{items}}
</fieldset>
