<!DOCTYPE html>
<html lang="en-us">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<meta name="description" content="{{description}}" />
	<meta property="og:title" content="{{sitetitle}}" />
	<meta property="og:description" content="{{description}}" />
	<link href="/global/fontawesome/css/all.min.css" rel="stylesheet">
	<link rel="stylesheet" href="/designs/admin/admin.css" />
	<script src="/global/scripts/htmx.min.js"></script>
	<script src="/global/scripts/global.js" defer></script>
	<script src="/designs/admin/admin.js" defer></script>
	<script src="/global/scripts/jquery-3.7.1.min.js"></script>
	<script src="/global/trumbowyg/trumbowyg.min.js"></script>
	<link rel="stylesheet" href="/global/trumbowyg/ui/trumbowyg.min.css"/>
	<title>{{sitetitle}} {{pagetitle}}</title>
</head>
<body>
	<dialog id="cmsdialog" class="modal">
		<div class="buttonright" id="cmsdialogbar"><a id="cmsdialogclose" href="javascript:;"><i class="fa-regular fa-circle-xmark"></i></a></div>
		<div id="cmsdialogform">
		</div>
	</dialog>
	{{bodytop}}
<header>
	<div id="topbar">
		<div id="sitetitle"><a href="/">{{titleimage}}{{headersitetitle}}</a></div>
		<div id="mobilenav">
			<button id="searchicon" aria-controls="generate-slideout-menu" aria-expanded="false"><i class="fa-solid fa-magnifying-glass"></i></button>
			<button id="navicon" aria-controls="generate-slideout-menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
		</div>
	</div>
	<div id="sitesubtitle">{{subtitle}}</div>
	<div class="buttonright">
		<button title="site files" id="admineditsitecontrol" hx-get="/admin/getfilesform" hx-target="#cmsdialogform" onclick="document.getElementById('cmsdialog').showModal();"><i class="fa-solid fa-folder"></i></button>
		<button title="site settings" id="admineditsitecontrol" hx-get="/admin/getsiteform" hx-target="#cmsdialogform" onclick="document.getElementById('cmsdialog').showModal();"><i class="fa-solid fa-gear"></i></button>
		<button title="site security" id="admineditusercontrol" hx-get="/admin/getuserform" hx-target="#cmsdialogform" onclick="document.getElementById('cmsdialog').showModal();"><i class="fa-solid fa-user"></i></button>
	</div>
	<div id="searchbox">
		<input id="search" name="search" type="text" placeholder="search phrase" /><i class="fa-solid fa-magnifying-glass"></i>
	</div>
	<div id="nav">
		<nav>{{navigation}}</nav>
	</div>
</header>
	{{hero}}
	<main class="content">
		<div class="widthcontainer">
			<div id="pagecontent">
				<section>
					<div class="buttonright">
						<!--<button id="admineditpage" hx-post="/admin/getpageform/{{pageid}}" hx-target="#pagecontent"><i class="fa-regular fa-pen-to-square"></i></button>-->
						<button id="adminpageconfig" title="page settings" hx-get="/admin/getpageconfig/{{pageid}}" hx-target="#cmsdialogform" onclick="document.getElementById('cmsdialog').showModal();"><i class="fa-solid fa-gear"></i></button>
						<button id="adminaddpagecontrol" hx-post="/admin/getaddpageform/{{pageid}}" hx-target="#pagecontent"><i class="fa-solid fa-plus"></i></button>
						<button id="admindeletepagecontrol" hx-post="/admin/deletepage/{{pageid}}" hx-confirm="Are you absolutely sure you wish to delete this page?" hx-target="#pagecontent"><i class="fa-solid fa-trash"></i></button>
					</div>
					<form name="pagecontentform" id="pagecontentform" hx-post="/admin/pagecontentform">
						<input type="hidden" id="pageid" name="pageid" value="{{pageid}}"/>
						<h1 id="ce_pagetitle" contenteditable="true" onblur="javascript: $('#pagetitle').val($('#ce_pagetitle').text());">{{pagetitle}}</h1>
						<input id="pagetitle" name="pagetitle" type="hidden" value="{{pagetitle}}" />
						<div id="content" class="body">{{content}}</div>
						<div><button type="submit" class="savebutton" id="savecontent">Save</button></div>
						<script>$('#content').trumbowyg();</script>
					</form>
				</section>
			</div>
		</div>
	</main>
	<footer>
		<div class="widthcontainer">
			<div>{{footer1}}</div>
			<div>{{footer2}}</div>
			<div>{{footer3}}</div>
			<div>{{footer4}}</div>
		</div>
	</footer>
	{{bodybottom}}
</body>
</html>
