<!DOCTYPE html>
<html lang="en-us">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<meta name="description" content="{{description}}" />
	<meta property="og:title" content="{{sitetitle}}" />
	<meta property="og:description" content="{{description}}" />
	<link href="/global/fontawesome/css/all.min.css" rel="stylesheet">
	<link rel="stylesheet" href="/designs/repairshop/repairshop.css" />
	<script src="/global/scripts/jquery-3.7.1.min.js"></script>
	<script src="/global/scripts/htmx.min.js"></script>
	<script src="/global/scripts/global.js" defer></script>
	<link rel="icon" href="/designs/repairshop/images/favicon.png" type="image/png">
	<link rel="apple-touch-icon" href="/designs/repairshop/images/apple-touch-icon.png">
	<title>{{sitetitle}} {{pagetitle}}</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Coda:wght@400;800&family=Warnes&display=swap" rel="stylesheet">
</head>
<body>
	{{bodytop}}
	<header>
		<div class="stripes"><!-- --></div>
		<div id="topbar" class="widthcontainer">
			<img id="logo" src="/designs/repairshop/images/logo.png" alt="logo" />
			<div id="sitetitle">
				<a href="/">{{sitetitle}}</a>
				<div id="line1" class="line"></div>
				<div id="line2" class="line"></div>
				<div id="line3" class="line"></div>
				<div id="line4" class="line"></div>
				<div id="line5" class="line"></div>
				<div id="line6" class="line"></div>
			</div>
			<div id="flex-spacer"></div>
			<form id="searchform" hx-post="/search" hx-target="#pagecontent">
				<input id="search" name="searchText" type="text" placeholder="search phrase" aria-label="search field" />
				<button id="searchbutton" type="submit" aria-label="search"><i class="fa-solid fa-magnifying-glass" aria-label="search"></i></button>
			</form>
			<button id="searchicon" aria-label="open search" aria-controls="generate-slideout-menu" aria-expanded="false"><i class="fa-solid fa-magnifying-glass"></i></button>
			<button id="navicon" aria-label="open nav" aria-controls="generate-slideout-menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
			<button id="lightdark" class="lightdark" type="button" aria-label="light or dark theme"><i class="fa-regular fa-moon"></i></button>
		</div>
		{{subtitle}}
		<div id="nav" class="widthcontainer">
			<nav>{{navigation}}</nav>
		</div>
	</header>
	{{hero}}
	<main class="content">
		<div class="container">
			<div id="pagecontent" aria-live="polite">
				<section>
					<div class="body">
						<h1>{{pagetitle}}</h1>
						<div class="content">{{content}}</div>
					</div>
					</section>
				</section>
				<div id="blocks" class="body">{{blocks}}</div>
			</div>
		</div>
	</main>
	<footer>
		<div class="widthcontainer">
			<div id="footers">
				{{footer1}}{{footer2}}{{footer3}}{{footer4}}
			</div>
		</div>
	</footer>
	{{bodybottom}}
</body>
</html>
