<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="I should be writing code">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    #cursor { animation: blink 1.1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { #cursor { animation: none; } }
  </style>

  <!-- window -->
  <rect x="0.5" y="0.5" width="719" height="239" rx="10" fill="#17181C" stroke="#2A2C33"/>

  <!-- title bar (top corners rounded, bottom square) -->
  <path d="M10.5 0.5h699a10 10 0 0 1 10 10V46H0.5V10.5a10 10 0 0 1 10-10z" fill="#24252B" stroke="#2A2C33"/>
  <line x1="0.5" y1="46.5" x2="719.5" y2="46.5" stroke="#2A2C33"/>
  <text x="360" y="28" text-anchor="middle" class="mono" font-size="16" font-weight="600" fill="#B4BAC5">todo.js — ~/projects</text>

  <!-- window controls: minimize, maximize, close -->
  <g stroke="#C9CED6" stroke-width="1.6" stroke-linecap="round" fill="none">
    <circle cx="627" cy="23" r="13" fill="#33353D" stroke="none"/>
    <path d="M623.5 25.5h7"/>
    <circle cx="661" cy="23" r="13" fill="#33353D" stroke="none"/>
    <rect x="657.5" y="19.5" width="7" height="7" rx="1"/>
    <circle cx="695" cy="23" r="13" fill="#33353D" stroke="none"/>
    <path d="M692 20l6 6M698 20l-6 6"/>
  </g>

  <!-- line numbers -->
  <g class="mono" font-size="24" fill="#5C6370" text-anchor="end">
    <text x="44" y="104">1</text>
    <text x="44" y="148">2</text>
    <text x="44" y="192">3</text>
  </g>

  <!-- the comment -->
  <text x="64" y="148" class="mono" font-size="30" xml:space="preserve"><tspan fill="#7C8494">/*</tspan> <tspan fill="#E8E6E3" font-style="italic">I should be writing code</tspan> <tspan fill="#7C8494">*/</tspan></text>

  <!-- blinking cursor -->
  <rect id="cursor" x="64" y="169" width="15" height="34" fill="#7EE787"/>
</svg>
